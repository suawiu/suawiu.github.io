{{ define "main" }}
<div class="mx-auto mb-16 mt-12 max-w-4xl px-4">

  <div class="mb-10">
    <h1 class="text-4xl font-extrabold text-black dark:text-slate-200">Media</h1>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-3 gap-5">
    {{ range .Params.items }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
      class="group flex flex-col overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700/50 bg-white dark:bg-slate-800/50 no-underline card-item">

      {{ with .image }}
      <div class="overflow-hidden">
        <img src="{{ . }}" alt=""
          class="w-full h-44 object-cover card-image" loading="lazy" />
      </div>
      {{ end }}

      <div class="flex flex-col flex-1 p-4 gap-2">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <span class="text-[10px] font-bold uppercase tracking-wider
            {{ if eq .source "SK hynix Newsroom" }}text-orange-500 dark:text-orange-400
            {{ else if eq .source "GQ Korea" }}text-slate-500 dark:text-slate-400
            {{ else }}text-cyan-600 dark:text-cyan-400{{ end }}">#{{ .source }}</span>
          <div class="flex items-center gap-1 text-xs font-bold text-slate-400 group-hover:text-cyan-500 transition-colors">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span>{{ .date }}</span>
          </div>
        </div>

        <h2 class="text-sm font-bold text-slate-900 dark:text-slate-100 group-hover:text-cyan-600 dark:group-hover:text-cyan-400 transition-colors leading-snug line-clamp-3 flex-1">
          {{ .title }}
        </h2>

        <div class="flex items-center gap-1 text-xs font-medium text-cyan-600 dark:text-cyan-400 mt-1">
          <span>기사 보기</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </div>
      </div>

    </a>
    {{ end }}
  </div>

</div>
{{ end }}
